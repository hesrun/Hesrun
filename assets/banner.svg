<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">Vladyslav Otroshchenko — Frontend Engineer</title>
  <desc id="d">Fast websites, React and Next.js apps, motion and AI integrations.</desc>
  <defs>
    <clipPath id="card"><rect width="1200" height="360" rx="24"/></clipPath>
    <radialGradient id="glowR" cx="85%" cy="10%" r="60%">
      <stop offset="0" stop-color="#5cc9a7" stop-opacity=".35"/>
      <stop offset="1" stop-color="#5cc9a7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowL" cx="5%" cy="100%" r="55%">
      <stop offset="0" stop-color="#5cc9a7" stop-opacity=".2"/>
      <stop offset="1" stop-color="#5cc9a7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#5cc9a7"/>
      <stop offset="1" stop-color="#9fe8d1"/>
    </linearGradient>
    <style>
      .sans { font-family: 'Archivo', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace; }
      .g { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .f1 { animation: float 9s ease-in-out infinite alternate; }
      .f2 { animation: float 12s ease-in-out -3s infinite alternate; }
      .f3 { animation: float 10s ease-in-out -6s infinite alternate; }
      .f4 { animation: float 14s ease-in-out -2s infinite alternate; }
      .in1 { animation: rise 1s cubic-bezier(.16,1,.3,1) .1s both; }
      .in2 { animation: rise 1s cubic-bezier(.16,1,.3,1) .25s both; }
      .in3 { animation: rise 1s cubic-bezier(.16,1,.3,1) .4s both; }
      .in4 { animation: rise 1s cubic-bezier(.16,1,.3,1) .55s both; }
      .caret { animation: blink 1.1s steps(1) infinite; }
      @keyframes float { from { transform: translate(0, 0) rotate(0deg); } to { transform: translate(10px, -14px) rotate(8deg); } }
      @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <!-- One rounded clip for everything, so no layer edges peek out at the corners. -->
  <g clip-path="url(#card)">
  <rect width="1200" height="360" fill="#000"/>
  <rect width="1200" height="360" fill="url(#glowR)"/>
  <rect width="1200" height="360" fill="url(#glowL)"/>

  <!-- giant ghost word -->
  <text x="1210" y="330" text-anchor="end" class="sans" font-size="210" font-weight="800" fill="#fff" fill-opacity=".03" letter-spacing="-8">frontend</text>

  <!-- floating code glyphs -->
  <g class="g" stroke="#5cc9a7" stroke-width="5">
    <g class="f1" style="transform-origin: 1020px 80px"><path d="M1032 52c-9 0-11 6-11 14v8c0 6-4 8-11 8 7 0 11 2 11 8v8c0 8 2 14 11 14" stroke-opacity=".9"/></g>
    <g class="f2" style="transform-origin: 1110px 210px"><path d="M1124 188 1098 210l26 22" stroke-opacity=".55"/></g>
    <g class="f3" style="transform-origin: 930px 280px"><path d="M922 300 938 260" stroke="#fff" stroke-opacity=".35"/></g>
    <g class="f4" style="transform-origin: 1150px 110px"><path d="M1140 102h22M1140 116h22" stroke="#fff" stroke-opacity=".3"/></g>
    <g class="f2" style="transform-origin: 860px 70px"><path d="M852 56h-8v34h8" stroke="#fff" stroke-opacity=".25"/></g>
    <g class="f1" style="transform-origin: 1060px 300px"><path d="M1053 290v20M1046 293l14 14M1046 307l14-14" stroke-opacity=".5"/></g>
  </g>
  <g fill="#5cc9a7">
    <circle class="f3" cx="980" cy="160" r="4" fill-opacity=".8" style="transform-origin: 980px 160px"/>
    <circle class="f4" cx="1170" cy="300" r="3" fill-opacity=".5" style="transform-origin: 1170px 300px"/>
    <circle class="f1" cx="890" cy="200" r="3" fill="#fff" fill-opacity=".3" style="transform-origin: 890px 200px"/>
  </g>

  <!-- mark -->
  <g class="in1" transform="translate(64 58)">
    <text class="mono" font-size="22" fill="#fff">{<tspan fill="#5cc9a7">•</tspan>}</text>
    <text x="52" class="sans" font-size="20" font-weight="700" fill="#fff">Hesrun</text>
  </g>

  <!-- headline -->
  <text class="sans in2" x="64" y="158" font-size="58" font-weight="600" fill="#fff" letter-spacing="-2">Hi, I’m Vladyslav,</text>
  <text class="sans in3" x="64" y="226" font-size="58" font-weight="600" fill="#fff" letter-spacing="-2">a <tspan fill="url(#fade)">frontend</tspan> engineer</text>

  <!-- lead -->
  <text class="mono in4" x="64" y="290" font-size="17" fill="#9a9a9a">// fast websites · React &amp; Next.js apps · motion · AI integrations<tspan class="caret" fill="#5cc9a7"> ▍</tspan></text>
  </g>
</svg>
